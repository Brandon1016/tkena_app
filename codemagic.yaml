workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2  # única máquina disponible en el plan gratuito de Codemagic
    environment:
      android_signing:
        # "codemagic_keystore" = el "Reference name" que le pusiste al
        # subir tu .keystore en el paso 3 de arriba.
        - codemagic_keystore
      vars:
        PACKAGE_NAME: "com.mrbot.tkena"  # el mismo appId de capacitor.config.json
      node: latest
      java: 21  # el build de Capacitor/Gradle necesita Java 21, no la versión default
    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"
      - name: Instalar dependencias npm
        script: |
          npm install
      - name: Compilar la app web (Vite build -> dist/)
        script: npm run build
      - name: Sincronizar con el proyecto nativo Android
        script: |
          npx cap sync android
      - name: Compilar el APK firmado
        script: |
          cd android
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - tu_correo@ejemplo.com
        notify:
          success: true
          failure: true
